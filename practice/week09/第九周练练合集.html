<!DOCTYPE html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>第九周练练合集</title>
  <script src="../../js/echarts.min.js"></script>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: "Microsoft YaHei", sans-serif;
      background: #f4f6fa;
      color: #333;
      padding: 20px;
    }

    h1 {
      font-size: 22px;
      margin-bottom: 6px;
    }

    .sub {
      color: #666;
      font-size: 13px;
      margin-bottom: 16px;
    }

    .toolbar {
      background: #fff;
      border-radius: 10px;
      padding: 14px 16px;
      margin-bottom: 16px;
      display: flex;
      flex-wrap: wrap;
      gap: 18px;
      align-items: center;
      box-shadow: 0 1px 4px rgba(0, 0, 0, .08);
    }

    .toolbar label {
      font-size: 13px;
      color: #555;
    }

    .toolbar input[type=text] {
      padding: 6px 10px;
      border: 1px solid #ccc;
      border-radius: 6px;
      width: 200px;
      font-size: 13px;
    }

    .toolbar select {
      padding: 6px 10px;
      border: 1px solid #ccc;
      border-radius: 6px;
      font-size: 13px;
    }

    .toolbar input[type=range] {
      width: 120px;
      vertical-align: middle;
    }

    .toolbar .range-val {
      font-size: 12px;
      color: #1f6feb;
      min-width: 90px;
      display: inline-block;
    }

    .btn {
      padding: 6px 14px;
      border: none;
      border-radius: 6px;
      background: #1f6feb;
      color: #fff;
      font-size: 13px;
      cursor: pointer;
    }

    .btn:hover {
      background: #1858c8;
    }

    .cards {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 14px;
      margin-bottom: 16px;
    }

    .card {
      background: #fff;
      border-radius: 10px;
      padding: 14px;
      text-align: center;
      box-shadow: 0 1px 4px rgba(0, 0, 0, .08);
    }

    .card .num {
      font-size: 26px;
      font-weight: 700;
      color: #1f6feb;
    }

    .card .lbl {
      font-size: 12px;
      color: #888;
      margin-top: 4px;
    }

    .charts {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 14px;
      margin-bottom: 16px;
    }

    .chart-box {
      background: #fff;
      border-radius: 10px;
      padding: 10px;
      box-shadow: 0 1px 4px rgba(0, 0, 0, .08);
    }

    .chart-box h3 {
      font-size: 14px;
      color: #444;
      margin: 4px 6px 0;
    }

    .chart {
      width: 100%;
      height: 320px;
    }

    .panel {
      background: #fff;
      border-radius: 10px;
      padding: 14px 16px;
      margin-bottom: 16px;
      box-shadow: 0 1px 4px rgba(0, 0, 0, .08);
    }

    .panel h3 {
      font-size: 14px;
      color: #444;
      margin-bottom: 10px;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 13px;
    }

    th,
    td {
      padding: 7px 10px;
      text-align: left;
      border-bottom: 1px solid #eee;
    }

    th {
      background: #fafbfc;
      color: #555;
      font-weight: 600;
    }

    tr:hover {
      background: #f0f6ff;
    }

    .badge {
      display: inline-block;
      padding: 2px 8px;
      border-radius: 10px;
      font-size: 12px;
      background: #e8f1ff;
      color: #1f6feb;
    }

    .drill {
      display: none;
    }

    .drill.show {
      display: block;
    }

    .tip {
      font-size: 12px;
      color: #1f6feb;
      margin-bottom: 8px;
    }
  </style>
</head>

<body>

  <h1>第九周练练合集 · 交互功能四件套</h1>
  <div class="sub">数据源：games_clean.csv（第七周清洗产物，123 款真实游戏）｜练习：①搜索 ②下拉筛选 ③价格滑块 ④点击下钻（点击柱状图试试）</div>

  <!-- ============ 筛选工具栏 ============ -->
  <div class="toolbar">
    <!-- 练习一：搜索框（input 事件实时过滤，模糊匹配游戏名） -->
    <div>
      <label>练习一 · 搜索游戏：</label>
      <input type="text" id="kw" placeholder="输入游戏名关键词，如 Dota">
    </div>

    <!-- 练习二：下拉框（change 事件按主类型筛选） -->
    <div>
      <label>练习二 · 类型：</label>
      <select id="typeSel"></select>
    </div>

    <!-- 练习三：价格双滑块（input 事件，区间筛选） -->
    <div>
      <label>练习三 · 价格区间：</label>
      <input type="range" id="priceMin" min="0" max="348" value="0" step="5">
      <span class="range-val" id="priceMinV">¥0</span>
      <input type="range" id="priceMax" min="0" max="348" value="348" step="5">
      <span class="range-val" id="priceMaxV">¥348</span>
    </div>

    <button class="btn" id="reset">重置筛选</button>
  </div>

  <!-- ============ 统计卡片（随筛选实时联动） ============ -->
  <div class="cards">
    <div class="card">
      <div class="num" id="cCount">–</div>
      <div class="lbl">当前游戏数</div>
    </div>
    <div class="card">
      <div class="num" id="cPrice">–</div>
      <div class="lbl">平均价格(元)</div>
    </div>
    <div class="card">
      <div class="num" id="cRating">–</div>
      <div class="lbl">平均好评率(%)</div>
    </div>
    <div class="card">
      <div class="num" id="cFree">–</div>
      <div class="lbl">免费游戏数</div>
    </div>
  </div>

  <!-- ============ 图表区 ============ -->
  <div class="charts">
    <div class="chart-box">
      <h3>类型分布柱状图（练习四：点击柱子下钻该类型游戏）</h3>
      <div class="chart" id="barChart"></div>
    </div>
    <div class="chart-box">
      <h3>价格 × 好评率 散点图（悬停查看游戏）</h3>
      <div class="chart" id="scatterChart"></div>
    </div>
  </div>

  <!-- ============ 下钻面板（练习四） ============ -->
  <div class="panel drill" id="drillPanel">
    <h3 id="drillTitle">下钻明细</h3>
    <div class="tip">练习四：点击上方柱状图任意柱子，这里会列出该类型游戏（按好评率排序 Top15）</div>
    <table>
      <thead>
        <tr>
          <th>#</th>
          <th>游戏</th>
          <th>类型</th>
          <th>价格</th>
          <th>好评率</th>
          <th>评价数</th>
        </tr>
      </thead>
      <tbody id="drillBody"></tbody>
    </table>
  </div>

  <!-- ============ 明细表 ============ -->
  <div class="panel">
    <h3>筛选结果明细（练习一~三的组合筛选实时更新）</h3>
    <table>
      <thead>
        <tr>
          <th>游戏</th>
          <th>类型</th>
          <th>价格</th>
          <th>折扣</th>
          <th>好评率</th>
          <th>评价数</th>
          <th>年份</th>
        </tr>
      </thead>
      <tbody id="tableBody"></tbody>
    </table>
  </div>

    /* ==================== 工具函数 ==================== */
    const $ = id => document.getElementById(id);
    const fmt = n => n >= 10000 ? (n / 10000).toFixed(1) + '万' : String(n);
    const numFmt = n => Number.isFinite(n) ? n.toFixed(1) : '–';

    // 类型下拉框初始化（练习二：把数据里的主类型去重塞进 select）
    const types = [...new Set(RAW.map(g => g.type))].sort();
    $('typeSel').innerHTML = '<option value="">全部类型</option>' + types.map(t => `<option>${t}</option>`).join('');

    /* ==================== 组合筛选（练习一 + 二 + 三） ==================== */
    let currentDrillType = null;   // 记录当前下钻类型（点击柱状图时设置）

    function applyFilter() {
      const kw = $('kw').value.trim().toLowerCase();
      const type = $('typeSel').value;
      const pMin = +$('priceMin').value;
      const pMax = +$('priceMax').value;

      // 练习一：关键词模糊匹配（name 包含）；练习二：类型相等；练习三：价格区间
      const list = RAW.filter(g =>
        (!kw || g.name.toLowerCase().includes(kw)) &&
        (!type || g.type === type) &&
        (g.price >= pMin && g.price <= pMax)
      );

      // 联动更新：卡片 + 柱状图 + 散点图 + 明细表
      updateCards(list);
      renderBar(list);
      renderScatter(list);
      renderTable(list);
      renderDrill(list);
    }

    /* ==================== 统计卡片 ==================== */
    function updateCards(list) {
      const n = list.length;
      $('cCount').textContent = n;
      $('cPrice').textContent = n ? numFmt(list.reduce((s, g) => s + g.price, 0) / n) : '–';
      $('cRating').textContent = n ? numFmt(list.reduce((s, g) => s + g.rating, 0) / n) : '–';
      $('cFree').textContent = list.filter(g => g.price === 0).length;
    }

    /* ==================== 图表：类型分布柱状图（练习四的载体） ==================== */
    const barChart = echarts.init($('barChart'));
    function renderBar(list) {
      const map = {};
      list.forEach(g => map[g.type] = (map[g.type] || 0) + 1);
      const names = Object.keys(map).sort((a, b) => map[b] - map[a]);
      barChart.setOption({
        tooltip: { trigger: 'axis' },
        xAxis: { type: 'category', data: names, axisLabel: { rotate: 30 } },
        yAxis: { type: 'value', name: '游戏数' },
        series: [{
          type: 'bar', data: names.map(t => map[t]), barMaxWidth: 34,
          itemStyle: { color: '#4e8ef7', borderRadius: [4, 4, 0, 0] },
          emphasis: { itemStyle: { color: '#ff8a3d' } }
        }]
      }, true);
    }

    // 练习四：点击柱子 -> 记录类型并刷新下钻面板
    barChart.on('click', params => {
      currentDrillType = params.name;
      applyFilter();   // 面板内容依赖当前筛选结果，直接复用
    });

    /* ==================== 图表：价格×好评率散点图 ==================== */
    const scatterChart = echarts.init($('scatterChart'));
    function renderScatter(list) {
      const data = list.map(g => ({ value: [g.price, g.rating], name: g.name }));
      scatterChart.setOption({
        tooltip: { formatter: p => `${p.data.name}<br>价格 ¥${p.data.value[0]}　好评率 ${p.data.value[1]}%` },
        xAxis: { type: 'value', name: '价格(元)', max: 360 },
        yAxis: { type: 'value', name: '好评率(%)', max: 100 },
        series: [{
          type: 'scatter', data: data, symbolSize: 9,
          itemStyle: { color: 'rgba(78,142,247,.75)', borderColor: '#fff', borderWidth: 1 }
        }]
      }, true);
    }

    /* ==================== 明细表 ==================== */
    function renderTable(list) {
      const sorted = [...list].sort((a, b) => b.rating - a.rating);
      $('tableBody').innerHTML = sorted.map(g => `
    <tr>
      <td>${g.name}</td>
      <td>${g.type}</td>
      <td>${g.price === 0 ? '免费' : '¥' + g.price}</td>
      <td>${g.discount > 0 ? g.discount + '% OFF' : '—'}</td>
      <td>${g.rating}%</td>
      <td>${fmt(g.total_reviews)}</td>
      <td>${g.year}</td>
    </tr>`).join('');
    }

    /* ==================== 下钻面板（练习四） ==================== */
    function renderDrill(list) {
      const panel = $('drillPanel');
      if (!currentDrillType) { panel.classList.remove('show'); return; }
      const sub = list.filter(g => g.type === currentDrillType).sort((a, b) => b.rating - a.rating);
      $('drillTitle').textContent = `【${currentDrillType}】类游戏明细（当前筛选下 ${sub.length} 款）`;
      $('drillBody').innerHTML = sub.slice(0, 15).map((g, i) => `
    <tr><td>${i + 1}</td><td>${g.name}</td><td>${g.type}</td>
        <td>${g.price === 0 ? '免费' : '¥' + g.price}</td><td>${g.rating}%</td>
        <td>${fmt(g.total_reviews)}</td></tr>`).join('')
        || '<tr><td colspan="6" style="text-align:center;color:#999">当前筛选条件下该类型暂无游戏</td></tr>';
      panel.classList.add('show');
    }

    /* ==================== 事件绑定 ==================== */
    // 练习一：搜索框 input 事件
    $('kw').addEventListener('input', applyFilter);
    // 练习二：下拉 change 事件
    $('typeSel').addEventListener('change', applyFilter);
    // 练习三：两个滑块 input 事件
    $('priceMin').addEventListener('input', () => { $('priceMinV').textContent = '¥' + $('priceMin').value; applyFilter(); });
    $('priceMax').addEventListener('input', () => { $('priceMaxV').textContent = '¥' + $('priceMax').value; applyFilter(); });
    // 重置
    $('reset').addEventListener('click', () => {
      $('kw').value = ''; $('typeSel').value = ''; $('priceMin').value = 0; $('priceMax').value = 348;
      $('priceMinV').textContent = '¥0'; $('priceMaxV').textContent = '¥348';
      currentDrillType = null; applyFilter();
    });

    // 窗口变化时图表自适应
    window.addEventListener('resize', () => { barChart.resize(); scatterChart.resize(); });

    /* ==================== 首次渲染 ==================== */
    applyFilter();
  </script>
</body>

</html>
